openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /content/current:
    get:
      operationId: getCurrentImage
      tags: [content]
      responses:
        "200":
          description: Current globally published image, never linked to an identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentImage"
  /content/events:
    get:
      operationId: contentEvents
      tags: [content]
      responses:
        "200":
          description: Server sent publication change events
          content:
            text/event-stream:
              schema: { type: string }
  /content/images/{id}:
    get:
      operationId: getPublishedImageFile
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Only the currently published image
          content:
            image/webp:
              schema: { type: string, format: binary }
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      responses:
        "200":
          description: Authenticated user's server-enforced administrator status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Sign in required
  /admin/images:
    get:
      operationId: listAdminImages
      tags: [admin]
      responses:
        "200":
          description: Administrator-only image library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedImage"
  /admin/images/upload-url:
    post:
      operationId: requestImageUpload
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "201":
          description: Authenticated, expiring direct upload reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadTicket"
  /admin/images/{id}/complete:
    post:
      operationId: completeImageUpload
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Validated and sanitized image ready for preview and publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImage"
  /admin/images/{id}/publish:
    post:
      operationId: publishImage
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Atomically replaced the globally current image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentImage"
  /admin/images/{id}/hide:
    post:
      operationId: hideImage
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Image hidden; public content cleared if it was current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentImage"
  /admin/images/{id}:
    delete:
      operationId: deleteAdminImage
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Image permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteImageResult"
  /admin/images/{id}/file:
    get:
      operationId: getAdminImageFile
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Authenticated administrator-only preview
          content:
            image/webp:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    ImageId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ManagedImage:
      type: object
      required: [id, title, fileName, contentType, size, status, url, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
        status: { type: string, enum: [draft, published, hidden] }
        url: { type: string }
        createdAt: { type: string, format: date-time }
    PublicImage:
      type: object
      required: [id, title, url, publishedAt]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
    CurrentImage:
      type: object
      required: [image, revision]
      properties:
        image:
          oneOf:
            - $ref: "#/components/schemas/PublicImage"
            - type: "null"
        revision: { type: string }
    AdminSession:
      type: object
      required: [isAdmin, configured]
      properties:
        isAdmin: { type: boolean }
        configured: { type: boolean }
    ImageUploadInput:
      type: object
      required: [fileName, contentType, size, title]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 150 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    ImageUploadTicket:
      type: object
      required: [uploadURL, uploadId]
      properties:
        uploadURL: { type: string }
        uploadId: { type: string }
    DeleteImageResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

